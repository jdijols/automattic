name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast gate (lint + typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout + setup-node pinned to @v5 — the @v4 line runs on the
      # deprecated Node-20 actions runtime (a GitHub deprecation warning today).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Clean, reproducible install from the committed lockfile.
      # No --legacy-peer-deps: the dependency set must resolve cleanly (R8).
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # The fast unit suite — milliseconds, no WordPress. Includes the §5.3
      # adversarial corpus AND the pattern-blob SHA-256 manifest assertion
      # (a modified docs/pattern-library/**/pattern.html fails here, since the
      # blobs are trusted inputs to the assembler). The slow Playground gate is a
      # separate, path-filtered workflow (ci-playground.yml).
      - run: npm test
    # NOTE: no Anthropic key is needed here (no live AI calls in unit tests).
